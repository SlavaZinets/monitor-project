# Local development database only. Spring Boot's Docker Compose support
# starts this automatically on `./mvnw spring-boot:run`.
# Values come from `.env` (copy `.env.example` to `.env`; `.env` stays out of Git).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-monitor}
      POSTGRES_USER: ${DB_USERNAME:-monitor}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is not set - copy .env.example to .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
